help.evaluation.title=형세
help.evaluation.text=막대는 KataGo가 본 현재 국면의 승률입니다(왼쪽 흑, 오른쪽 백).\n\n점수: 덤을 포함해 몇 집 앞서는지(B+2.5 = 흑 2.5집 우세).\n\n방문 수: KataGo가 탐색한 국면 수. 많을수록 수치가 안정적이며, 처음에는 크게 움직입니다.
help.winrate_graph.title=승률 그래프
help.winrate_graph.text=진한 선은 매 수 뒤 흑의 승률(위: 흑 승, 아래: 백 승), 가는 선은 집 차이입니다. 갑자기 떨어진 곳은 방금 둔 쪽의 실수입니다.\n\n그래프를 클릭하거나 끌면 그 수로 이동합니다.\n\n기력 추정 후에는 점선이 초반·중반·종반을 나누고 구간별 추정 기력을 보여 줍니다.
help.report.title=리포트와 기력 추정
help.report.text=먼저 '대국 분석'(그래프 버튼)을 실행하세요. KataGo가 모든 국면을 평가합니다.\n\n최선수 / 상위 3수: KataGo의 1순위 또는 상위 3수를 둔 비율. 평균 손실: 한 수당 잃은 승률. 5% 넘으면 실수, 10% 넘으면 악수. 최악수: 손실이 큰 수(클릭하면 이동).\n\n기력 추정(막대 버튼): KataGo의 인간형 네트워크가 20급~9단 각 기력의 사람이 둘 수를 예측합니다. 매 수가 각 기력에서 얼마나 나올 법한지 재고, 대국 전체를 가장 잘 설명하는 기력을 추정치로 합니다. %는 확신도입니다. 인간 SL 네트워크가 필요하며 결과는 SGF에 저장됩니다.
