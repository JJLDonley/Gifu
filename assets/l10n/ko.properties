help.rank_compare.title=기력과 비교
help.rank_compare.text=기력을 고르면 아래 수치는 KataGo 인간형 네트워크로 그 기력의 사람이 둘 수와 비교한 값이 됩니다.\n\n{rank}가 둘 확률: 그 기력의 사람이 실제 둔 수를 고를 평균 확률. 추정 기력이 둘 확률: 추정 기력에서의 같은 값.\n\n{rank}다운 수: 추정 기력보다 고른 기력이 더 둘 법한 수의 비율. 두지 않을 수: 그 기력이 2% 미만으로 둘 수. 가장 그답지 않은 수를 보여 줍니다(클릭하면 이동).\n\n위 막대는 기력 추정 자체(채움: 가장 가능성 높은 기력, 테두리: 비교 기력). 그래프는 각 수의 확률입니다.
