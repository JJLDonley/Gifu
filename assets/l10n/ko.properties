help.deep_report.title=상세 리포트
help.deep_report.text=대국 분석이 두 선수에 대해 알려 주는 모든 것입니다. 먼저 대국 분석을 실행하세요. 방문 수(설정)를 늘리면 수치가 안정됩니다.\n\n정확도(0–100): 각 수의 점수는 100 × e^(−잃은 집 / 8). 손실 없음 100, 1집 88, 3집 69, 5집 54, 10집 29. 분석된 수의 평균이며 단계별(19줄 기준 초반 1–50, 중반 51–150, 종반 151–)로도 보여 줍니다.\n\n최선수 / 상위 3수: KataGo 1순위 또는 상위 3수와 일치한 비율. 잃은 승률과 집은 착수 전후 평가의 차이입니다.\n\n그래프나 행을 클릭하면 그 수로 이동합니다.
help.loss_graph.title=수마다 잃은 집
help.loss_graph.text=수마다 막대 하나: 흑은 가운데 선 위, 백은 아래. 높이는 잃은 집(15집 이상이면 최대). 회색은 작은 손실, 주황은 2–5집, 빨강은 5집 이상. 점선은 초반·중반·종반의 경계입니다.
