help.territory.title=집 추정
help.territory.text=지금 계가한다면 양쪽의 점수를 KataGo의 소유 지도로 추정합니다. 각 점은 그 점을 가질 가능성이 높은 쪽으로 셉니다. 계가(중국 규칙)는 돌과 집을, 집 계산(일본·한국 규칙)은 빈 점과 사석을 셉니다. 백의 합계에는 덤이 포함됩니다.\n\n합계는 KataGo의 집 차이에 맞게 조정되므로 평가 패널과 어긋나지 않습니다.
help.confidence.title=확정도
help.confidence.text=판이 얼마나 정리되었는지. 왼쪽부터: 흑의 확정 점(KataGo가 80% 이상 확신), 흑의 유력 점(40–80%), 미정 점, 백의 유력 점과 확정 점(백의 확정 점에는 덤 포함).\n\n확정된 판: 어느 한쪽의 확정 점이 차지하는 비율. 대국이 진행될수록 올라갑니다.

