help.human_winrate.title=인간 승률
help.human_winrate.text=선택한 기력의 사람들이 여기서 이길 확률을 KataGo의 집 차이와 수순으로 구합니다. KataGo 자체 승률(아래)은 완벽한 수를 가정하므로 사람의 대국보다 훨씬 자신만만합니다. 5집 차이는 KataGo에게는 거의 결정적이지만 1단끼리는 그렇지 않습니다.\n\n공식은 Quentin Rendu, “Go Players Should Not Trust AI Win Rate”, Journal of Go Studies 17(2), 2023에서 왔으며, 폭스의 12급–9단 대국 50–200수에 맞춘 것입니다(오차 약 1%). 기력은 설정 → 분석에서 고릅니다.

