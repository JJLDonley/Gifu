help.profile.text=汇总棋谱文件夹(及其子文件夹)中黑方或白方是你的名字的所有对局:执黑的你和执白的你并排显示,数字与深度报告相同。\n\n没有分析的对局会用 KataGo 分析一次(设置 → 分析:每个局面的访问数),并保存在 Gifu 的设置文件夹中;更新档案时只分析新的或修改过的对局。如果你的 GPU 一次只能运行一个 KataGo,分析期间实时分析会暂停。\n\n走势:每局的准确率,从旧到新;红圈表示输棋。对局:点击即可打开。

