help.territory.title=目数估计
help.territory.text=根据 KataGo 的归属图,估计现在终局时双方的点数:每个点算给可能拥有它的一方。数子法(中国规则)计算棋子和地;数目法(日本、韩国规则)计算空点和提子。白方合计包含贴目。\n\n合计会按 KataGo 的目差修正,因此不会与形势面板矛盾。
help.confidence.title=确定度
help.confidence.text=盘面的确定程度。从左到右:黑方的确定点(KataGo 至少 80% 确信)、黑方的可能点(40–80%)、未定点,然后是白方的可能点和确定点(白方确定点包含贴目)。\n\n盘面已定:任一方确定点占全盘的比例,随对局推进而上升。

