help.human_winrate.title=人类胜率
help.human_winrate.text=根据 KataGo 的目差和手数,计算所选水平的人类棋手从此处获胜的概率。KataGo 自己的胜率(下方)假设完美下法,因此比人类对局自信得多:5 目领先对 KataGo 几乎已定,但对业余初段并非如此。\n\n公式来自 Quentin Rendu《Go Players Should Not Trust AI Win Rate》(Journal of Go Studies 17(2), 2023),基于野狐 12 级至 9 段对局的第 50–200 手拟合(误差约 1%)。在设置 → 分析中选择水平。

