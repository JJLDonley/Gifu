help.rank_compare.title=与段位对比
help.rank_compare.text=选择一个段位后，下面的数字都是用 KataGo 人类网络与该段位棋手的着法对比得出的。\n\n{rank} 会下：该段位棋手选择实战着法的平均概率。本人段位会下：在估算段位下的同一数值。\n\n更像 {rank}：所选段位比本人段位更可能下出的着法比例。不会下：该段位下出概率低于 2% 的着法，列出最不像的几手（点击跳转）。\n\n上方柱状图是段位估算本身（实心：最可能的段位，描边：对比段位）。图表显示每一手的概率。
