help.deep_report.title=详细报告
help.deep_report.text=棋谱分析对双方的全部统计。请先运行“分析棋谱”；在设置中提高计算量会让数值更稳定。\n\n准确度（0–100）：每手得分 100 × e^(−损失目数 / 8)：无损失 100，1 目 88，3 目 69，5 目 54，10 目 29。取已分析着手的平均，并按阶段显示（19 路：布局 1–50，中盘 51–150，官子 151+）。\n\n最佳/前三：与 KataGo 第一推荐或前三推荐一致的比例。胜率和目数损失是落子前后评估之差。\n\n点击图表或表格行可跳到该手。\n\n引擎吻合度（LizzieYzy 的“准确度”）：KataGo 的搜索有多少落在实战着法上，取平均。用了一半计算量的着法算 50%，不在候选里的算 0%。需要用此版本分析的数据。
help.loss_graph.title=每手损失目数
help.loss_graph.text=每手一根柱：黑在中线上方，白在下方。高度是这手损失的目数（15 目以上为满格）；灰色为小损失，橙色 2–5 目，红色 5 目以上。虚线分隔布局、中盘和官子。
