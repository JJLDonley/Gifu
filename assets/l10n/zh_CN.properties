help.evaluation.title=形势
help.evaluation.text=条形图是 KataGo 判断的当前局面胜率：左边黑，右边白。\n\n目差：含贴目领先多少目（B+2.5 表示黑领先 2.5 目）。\n\n计算量：KataGo 搜索的局面数。越多越可靠，刚开始数值变化较大。
help.winrate_graph.title=胜率图
help.winrate_graph.text=深色线是每手之后黑的胜率（上方黑胜，下方白胜），细线是目差。突然下跌说明刚落子的一方出了错。\n\n点击或拖动图表可跳到该手。\n\n估算段位后，虚线把对局分为布局、中盘、官子，并显示各阶段双方的估算段位。
help.report.title=报告与段位估算
help.report.text=请先运行“分析棋谱”（图表按钮），KataGo 会评估每个局面。\n\n最佳/前三：选择 KataGo 第一推荐或前三推荐的比例。平均损失：每手损失的胜率。超过 5% 为疑问手，超过 10% 为恶手。最差：损失最大的几手（点击跳转）。\n\n段位估算（柱状按钮）：KataGo 的人类网络预测 20 级到 9 段各段位的人会怎么下。对每一手计算它在各段位出现的可能性，最能解释整盘棋的段位就是估算结果，百分比是把握程度。需要人类 SL 权重，结果保存在 SGF 中。
