help.evaluation.title=Evaluation
help.evaluation.text=The bar is each side's chance of winning in the current position according to KataGo: Black on the left, White on the right.\n\nScore: how many points the leading side is ahead, komi included (B+2.5 = Black leads by 2.5).\n\nVisits: how many positions KataGo has searched. More visits make the numbers more reliable; the first values move a lot.
help.winrate_graph.title=Win-rate graph
help.winrate_graph.text=The dark line is Black's win rate after every move (top: Black wins, bottom: White wins); the thin line is the score lead. A sudden drop is a mistake by the player who just moved.\n\nClick or drag on the graph to jump to that move.\n\nAfter a rank estimate, dashed lines split the game into opening, middle game and endgame, with each player's estimated rank in each part.
help.report.title=Report and rank estimate
help.report.text=Run Analyze game (chart button) first: KataGo evaluates every position of the game.\n\nBest move / Top 3: how often a player chose KataGo's first choice, or one of its top three. Avg loss: win rate given away per move. Mistakes lose over 5%, blunders over 10%. Worst: the biggest losses; click one to jump there.\n\nRank estimate (bars button): KataGo's human network predicts what players of each rank from 20k to 9d would play. For every move it measures how likely that exact move is at each rank; the rank that explains the whole game best is the estimate, and the percentage is how sure it is. Needs the human SL network; the result is saved in the SGF.
