help.rank_compare.title=Compare with a rank
help.rank_compare.text=Pick a rank; every number below is measured against what a player of that rank would play, using KataGo's human network.\n\n{rank} would play: the average probability a player of that rank picks the move that was played. Own rank would play: the same for the player's estimated rank.\n\nMore {rank}-like: share of moves the chosen rank finds likelier than the player's own rank does. Unlikely: moves that rank would play less than 2% of the time; the least likely ones are listed, click to jump.\n\nThe bars at the top are the rank estimate itself (filled: most likely rank, outlined: the rank you compare with). The graph shows the chosen rank's probability for every move.
