help.deep_report.title=Deep report
help.deep_report.text=Everything the game analysis says about both players. Run Analyze game first; more visits (Settings) give steadier numbers.\n\nAccuracy (0–100): every move scores 100 × e^(−points lost / 8): a perfect move 100, 1 point lost 88, 3 points 69, 5 points 54, 10 points 29. The accuracy is the average over the player's analysed moves, also per phase (opening 1–50, middle 51–150, endgame 151+ on 19×19).\n\nBest move / Top 3: how often the move was KataGo's first choice, or among its top three. Win rate lost and points lost compare KataGo's evaluation before and after the move.\n\nClick a graph or a row to jump to that move.\n\nEngine agreement (what LizzieYzy calls accuracy): how much of KataGo's search went to the move that was played, averaged. A move KataGo spent half its visits on counts 50%; a move outside its candidates counts 0. Needs analysis made with this version (older files only have the top moves).
help.loss_graph.title=Points lost per move
help.loss_graph.text=One bar per move: Black's above the middle line, White's below. The height is the score the move gave away (full height = 15 points or more); grey is small, orange 2–5 points, red 5 or more. Dashed lines separate the opening, middle game and endgame.
