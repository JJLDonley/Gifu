help.territory.title=Territory estimate
help.territory.text=Each side's points if the game were counted now, from KataGo's ownership map: every point counts for the side that probably owns it. Area counting (Chinese rules) adds stones and territory; territory counting (Japanese, Korean) counts empty points and prisoners. White's total includes komi.\n\nThe totals are nudged to agree with KataGo's score lead, so they never contradict the Evaluation panel.
help.confidence.title=Confidence
help.confidence.text=How settled the board is. From the left: Black's secure points (KataGo is at least 80% sure), Black's likely points (40–80%), unclaimed points, then White's likely and secure points (White's secure points include komi).\n\nBoard decided: the share of the board's points that are secure for either side. It rises as the game settles.

