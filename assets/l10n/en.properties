help.human_winrate.title=Human win rate
help.human_winrate.text=The chance that human players of the chosen strength win from here, from KataGo's score lead and the move number. KataGo's own win rate (below) assumes perfect play, so it is far more confident than a human game warrants: a 5-point lead is nearly decisive for KataGo but not for 1-dan players.\n\nThe formula comes from Quentin Rendu, “Go Players Should Not Trust AI Win Rate”, Journal of Go Studies 17(2), 2023, fitted on Fox games from 12 kyu to 9 dan between moves 50 and 200 (about 1% error there). Choose the strength in Settings → Analysis.

