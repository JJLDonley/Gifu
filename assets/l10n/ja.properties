help.rank_compare.title=棋力との比較
help.rank_compare.text=棋力を選ぶと、以下の数値は KataGo の人間ネットワークでその棋力の人が打つ手と比べたものになります。\n\n{rank} の着手率：その棋力の人が実戦の手を選ぶ平均確率。推定棋力の着手率：推定棋力での同じ値。\n\n{rank} らしい手：推定棋力よりも選んだ棋力の方が打ちそうな手の割合。打たない手：その棋力が 2% 未満でしか打たない手。最もらしくない手を表示します（クリックで移動）。\n\n上の棒は棋力推定そのもの（塗り：最も可能性の高い棋力、枠：比較する棋力）。グラフは各手の確率です。
