help.evaluation.title=形勢
help.evaluation.text=バーは KataGo が判断した現局面の勝率です（左が黒、右が白）。\n\nスコア：コミ込みで何目リードしているか（B+2.5 は黒が 2.5 目リード）。\n\n探索数：KataGo が読んだ局面の数。多いほど数値が安定します。最初のうちは大きく動きます。
help.winrate_graph.title=勝率グラフ
help.winrate_graph.text=濃い線は各手の後の黒の勝率（上が黒勝ち、下が白勝ち）、細い線は目数差です。急に落ちたところは直前に打った側の悪手です。\n\nグラフをクリック／ドラッグするとその手へ移動します。\n\n棋力推定の後は、点線で序盤・中盤・終盤に分かれ、それぞれの推定棋力が表示されます。
help.report.title=レポートと棋力推定
help.report.text=先に「棋譜を解析」（グラフボタン）を実行してください。KataGo が全局面を評価します。\n\n最善手／上位3手：KataGo の第一候補、または上位3手を選んだ割合。平均損失：1手あたりに失った勝率。5% 超が疑問手、10% 超が悪手。ワースト：損失の大きい手（クリックで移動）。\n\n棋力推定（棒グラフボタン）：KataGo の人間ネットワークが 20級〜9段の各棋力の人が打ちそうな手を予測します。各手がそれぞれの棋力でどれだけ打たれやすいかを測り、対局全体を最もよく説明する棋力を推定値とします。% は確からしさです。人間 SL ネットワークが必要で、結果は SGF に保存されます。
