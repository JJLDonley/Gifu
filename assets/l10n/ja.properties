help.territory.title=地合いの見積もり
help.territory.text=今終局したときの各陣営の点数を KataGo の所有マップから見積もります。各点はおそらく所有する側に数えられます。面積計算(中国ルール)は石と地を、地計算(日本・韓国ルール)は空点とアゲハマを数えます。白の合計にはコミを含みます。\n\n合計は KataGo の目差に合わせて補正されるため、評価パネルと矛盾しません。
help.confidence.title=確定度
help.confidence.text=盤面がどれだけ決まっているか。左から:黒の確定点(KataGo が 80% 以上確信)、黒の有力点(40〜80%)、未確定の点、白の有力点と確定点(白の確定点にはコミを含む)。\n\n確定した盤面:どちらかの確定点の割合。対局が進むと上がります。

