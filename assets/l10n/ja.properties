help.deep_report.title=詳細レポート
help.deep_report.text=棋譜解析から分かる両者のすべての情報です。先に「棋譜を解析」を実行してください。探索数（設定）を増やすと数値が安定します。\n\n正確度（0〜100）：各手のスコアは 100 × e^(−損失目数 / 8)。損失なし 100、1目 88、3目 69、5目 54、10目 29。解析済みの手の平均で、局面別（19路で序盤 1〜50、中盤 51〜150、終盤 151〜）にも表示します。\n\n最善手／上位3手：KataGo の第一候補または上位3手と一致した割合。勝率・目数の損失は着手前後の評価の差です。\n\nグラフや行をクリックするとその手へ移動します。
help.loss_graph.title=1手ごとの損失
help.loss_graph.text=1手につき1本の棒：黒は中央線の上、白は下。高さは失った目数（15目以上で最大）。灰色は小さな損失、橙は2〜5目、赤は5目以上。点線は序盤・中盤・終盤の区切りです。
