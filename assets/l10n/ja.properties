help.human_winrate.text=選んだ棋力の人間同士がここから勝つ確率を、KataGo の目差と手数から求めます。KataGo 自身の勝率(下)は完璧な打ち手を前提とするため、人間の対局よりずっと強気です。5 目の差は KataGo にとってほぼ決定的でも、初段同士ではそうではありません。\n\n式は Quentin Rendu「Go Players Should Not Trust AI Win Rate」(Journal of Go Studies 17(2), 2023)によるもので、野狐の 12 級〜9 段の対局の 50〜200 手目に当てはめたものです(誤差は約 1%)。棋力は設定 → 解析で選びます。

