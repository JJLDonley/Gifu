help.territory.title=目數估計
help.territory.text=根據 KataGo 的歸屬圖,估計現在終局時雙方的點數:每個點算給可能擁有它的一方。數子法(中國規則)計算棋子和地;數目法(日本、韓國規則)計算空點和提子。白方合計包含貼目。\n\n合計會依 KataGo 的目差修正,因此不會與形勢面板矛盾。
help.confidence.title=確定度
help.confidence.text=盤面的確定程度。從左到右:黑方的確定點(KataGo 至少 80% 確信)、黑方的可能點(40–80%)、未定點,然後是白方的可能點和確定點(白方確定點包含貼目)。\n\n盤面已定:任一方確定點佔全盤的比例,隨對局推進而上升。

