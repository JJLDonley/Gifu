help.rank_compare.title=與段位對比
help.rank_compare.text=選擇一個段位後，下面的數字都是用 KataGo 人類網路與該段位棋手的著法對比得出的。\n\n{rank} 會下：該段位棋手選擇實戰著法的平均機率。本人段位會下：在估算段位下的同一數值。\n\n更像 {rank}：所選段位比本人段位更可能下出的著法比例。不會下：該段位下出機率低於 2% 的著法，列出最不像的幾手（點擊跳轉）。\n\n上方長條圖是段位估算本身（實心：最可能的段位，描邊：對比段位）。圖表顯示每一手的機率。
