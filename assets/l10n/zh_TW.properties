help.profile.text=彙總棋譜資料夾(及其子資料夾)中黑方或白方是你的名字的所有對局:執黑的你和執白的你並排顯示,數字與深度報告相同。\n\n沒有分析的對局會用 KataGo 分析一次(設定 → 分析:每個局面的訪問數),並保存在 Gifu 的設定資料夾中;更新檔案時只分析新的或修改過的對局。如果你的 GPU 一次只能執行一個 KataGo,分析期間即時分析會暫停。\n\n走勢:每局的準確率,從舊到新;紅圈表示輸棋。對局:點擊即可開啟。

