help.evaluation.title=形勢
help.evaluation.text=條形圖是 KataGo 判斷的目前局面勝率：左邊黑，右邊白。\n\n目差：含貼目領先多少目（B+2.5 表示黑領先 2.5 目）。\n\n計算量：KataGo 搜尋的局面數。越多越可靠，剛開始數值變化較大。
help.winrate_graph.title=勝率圖
help.winrate_graph.text=深色線是每手之後黑的勝率（上方黑勝，下方白勝），細線是目差。突然下跌代表剛落子的一方出錯。\n\n點擊或拖曳圖表可跳到該手。\n\n估算段位後，虛線把對局分為布局、中盤、官子，並顯示各階段雙方的估算段位。
help.report.title=報告與段位估算
help.report.text=請先執行「分析棋譜」（圖表按鈕），KataGo 會評估每個局面。\n\n最佳/前三：選擇 KataGo 第一推薦或前三推薦的比例。平均損失：每手損失的勝率。超過 5% 為疑問手，超過 10% 為惡手。最差：損失最大的幾手（點擊跳轉）。\n\n段位估算（長條按鈕）：KataGo 的人類網路預測 20 級到 9 段各段位的人會怎麼下。對每一手計算它在各段位出現的可能性，最能解釋整盤棋的段位就是估算結果，百分比是把握程度。需要人類 SL 權重，結果儲存在 SGF 中。
