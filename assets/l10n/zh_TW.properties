help.human_winrate.text=根據 KataGo 的目差和手數,計算所選水準的人類棋手從此處獲勝的機率。KataGo 自己的勝率(下方)假設完美下法,因此比人類對局自信得多:5 目領先對 KataGo 幾乎已定,但對業餘初段並非如此。\n\n公式來自 Quentin Rendu《Go Players Should Not Trust AI Win Rate》(Journal of Go Studies 17(2), 2023),以野狐 12 級至 9 段對局的第 50–200 手擬合(誤差約 1%)。在設定 → 分析中選擇水準。

