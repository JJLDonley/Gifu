help.deep_report.title=詳細報告
help.deep_report.text=棋譜分析對雙方的全部統計。請先執行「分析棋譜」；在設定中提高計算量會讓數值更穩定。\n\n準確度（0–100）：每手得分 100 × e^(−損失目數 / 8)：無損失 100，1 目 88，3 目 69，5 目 54，10 目 29。取已分析著手的平均，並按階段顯示（19 路：布局 1–50，中盤 51–150，官子 151+）。\n\n最佳/前三：與 KataGo 第一推薦或前三推薦一致的比例。勝率和目數損失是落子前後評估之差。\n\n點擊圖表或表格列可跳到該手。\n\n引擎吻合度（LizzieYzy 的「準確度」）：KataGo 的搜尋有多少落在實戰著法上，取平均。用了一半計算量的著法算 50%，不在候選裡的算 0%。需要用此版本分析的資料。
help.loss_graph.title=每手損失目數
help.loss_graph.text=每手一根柱：黑在中線上方，白在下方。高度是這手損失的目數（15 目以上為滿格）；灰色為小損失，橘色 2–5 目，紅色 5 目以上。虛線分隔布局、中盤和官子。
